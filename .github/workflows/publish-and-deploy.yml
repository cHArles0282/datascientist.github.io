name: Publish next post and deploy site

on:
  schedule:
    # Mondays and Thursdays 03:30 UTC = 09:00 IST. GitHub may start scheduled runs a few minutes late.
    - cron: "30 3 * * 1,4"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the next queued post before deploying"
        type: boolean
        default: true
  push:
    branches: [master]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.next.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: next
        run: python scripts/publish_next.py
      - name: Commit
        if: steps.next.outputs.published != ''
        env:
          TITLE: ${{ steps.next.outputs.published }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A _queue _posts
          git commit -m "Publish: $TITLE"
          git push

  build:
    needs: publish
    if: always() && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # picks up the commit the publish job just pushed
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - id: pages
        uses: actions/configure-pages@v5
      - run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
          LANG: C.UTF-8
      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
